<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181326"/>
      <stop offset="50%" stop-color="#0d0b14"/>
      <stop offset="100%" stop-color="#24143a"/>
    </linearGradient>
    <linearGradient id="star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#a855f7" stroke-width="3" stroke-opacity="0.4"/>
  
  <!-- Outer Star Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#e879f9" stroke-width="2" stroke-dasharray="12 8" stroke-opacity="0.45"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Four-Pointed Star of Startorch -->
  <g filter="url(#glow)">
    <path d="M256,70 L285,215 L430,256 L285,297 L256,442 L227,297 L82,256 L227,215 Z" fill="url(#star)"/>
  </g>
  
  <!-- Center Core Crystal -->
  <polygon points="256,190 302,256 256,322 210,256" fill="#ffffff" opacity="0.95"/>
  <circle cx="256" cy="256" r="18" fill="#a855f7"/>
</svg>
